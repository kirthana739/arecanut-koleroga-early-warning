<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koleroga Early-Warning Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f4; color: #1d2a1d; }
  header { background: #2f5d34; color: #fff; padding: 16px 24px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  #risk { display: inline-block; padding: 10px 28px; border-radius: 30px; font-size: 28px; font-weight: 700; color: #fff; background: #888; }
  .stats { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 14px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: #667; }
  .note { font-size: 12px; color: #667; margin-top: 8px; }
  canvas { max-height: 260px; }
</style>
</head>
<body>
<header>
  <h1>Arecanut Koleroga Early-Warning</h1>
  <p>Simulated sensor node replaying real weather data for Sullya, Karnataka</p>
</header>
<main>
  <div class="card">
    <div id="risk">...</div>
    <div class="stats">
      <div class="stat"><b id="rainHrs">-</b><span>hours of rain (48 h)</span></div>
      <div class="stat"><b id="humHrs">-</b><span>hours at 95%+ humidity</span></div>
      <div class="stat"><b id="rainMm">-</b><span>mm rain (48 h)</span></div>
      <div class="stat"><b id="asOf">-</b><span>data as of</span></div>
    </div>
    <div class="note" id="msg"></div>
  </div>
  <div class="card"><canvas id="tempChart"></canvas></div>
  <div class="card"><canvas id="rainChart"></canvas></div>
</main>
<script>
const colors = { Low: "#3b8f3f", Medium: "#e0952a", High: "#d23a3a" };
let tempChart, rainChart;

function setText(id, value) {
  document.getElementById(id).textContent = value;
}

async function refresh() {
  try {
    const risk = await (await fetch("/risk")).json();
    const el = document.getElementById("risk");
    el.textContent = risk.level;
    el.style.background = colors[risk.level] || "#888";
    setText("rainHrs", risk.rain_hrs ?? "-");
    setText("humHrs", risk.hum95_hrs ?? "-");
    setText("rainMm", risk.rain_mm ?? "-");
    setText("asOf", risk.as_of ? risk.as_of.slice(5, 16) : "-");
    setText("msg", risk.level === "Not enough data" || risk.level === "No data"
      ? "Waiting for at least 24 hours of readings." : "");

    const rows = (await (await fetch("/readings?limit=200")).json()).reverse();
    const labels = rows.map(r => r.time.slice(5, 16));
    const temp = rows.map(r => r.temperature);
    const hum = rows.map(r => r.humidity);
    const rain = rows.map(r => r.rain_mm);

    if (!tempChart) {
      tempChart = new Chart(document.getElementById("tempChart"), {
        type: "line",
        data: { labels, datasets: [
          { label: "Temperature (C)", data: temp, borderColor: "#d2693a", pointRadius: 0, yAxisID: "y" },
          { label: "Humidity (%)", data: hum, borderColor: "#3a78d2", pointRadius: 0, yAxisID: "y1" } ] },
        options: { animation: false, scales: {
          y: { position: "left", title: { display: true, text: "C" } },
          y1: { position: "right", min: 0, max: 100, grid: { drawOnChartArea: false }, title: { display: true, text: "%" } } } }
      });
      rainChart = new Chart(document.getElementById("rainChart"), {
        type: "bar",
        data: { labels, datasets: [{ label: "Rain (mm)", data: rain, backgroundColor: "#3a78d2" }] },
        options: { animation: false }
      });
    } else {
      tempChart.data.labels = labels;
      tempChart.data.datasets[0].data = temp;
      tempChart.data.datasets[1].data = hum;
      tempChart.update();
      rainChart.data.labels = labels;
      rainChart.data.datasets[0].data = rain;
      rainChart.update();
    }
  } catch (e) {
    setText("msg", "Cannot reach the API. Is the server running?");
  }
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
